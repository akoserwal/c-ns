services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile.example
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/app
    ports:
      - "8000:8000"
    depends_on:
      - db

